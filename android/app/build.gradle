plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.varian.engcomp'
    compileSdk 34

    defaultConfig {
        applicationId "com.varian.engcomp"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Target arm64 only — no native build this phase; keeps APK sane for OnnxRuntime AAR
        ndk { abiFilters "arm64-v8a" }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { compose true }

    // Kotlin 1.9.22 → Compose compiler 1.5.15 (confirmed on Google Maven)
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }

    // Prevent ONNX model and flat binary index from being compressed in the APK.
    // Large assets must remain uncompressed so they can be memory-mapped / read via AssetManager.
    // TODO(delivery): model.onnx is ~448 MB. For production, move it to on-first-run download
    //   (e.g. Firebase App Distribution or a signed URL on first launch) and remove it from assets,
    //   or ship via Android App Bundle with Play Asset Delivery (install-time). Do NOT ship a
    //   448 MB asset in a standard APK on the Play Store (50 MB limit on APK, 100 MB on AAB
    //   without PAD). For development/sideload builds this is acceptable.
    androidResources {
        noCompress += ["onnx", "bin"]
    }
}

dependencies {
    // ── Compose BOM (pins all compose-* versions coherently) ──────────────────────────────────
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ── Core AndroidX ─────────────────────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.1'

    // ── Lifecycle / ViewModel (Compose-aware) ─────────────────────────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    // ── Navigation ────────────────────────────────────────────────────────────────────────────
    // Used for conversations drawer / screen routing (Slice B+); added now so the dependency
    // graph is coherent from the start.
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // ── Coroutines ────────────────────────────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ── JSON ──────────────────────────────────────────────────────────────────────────────────
    implementation 'com.google.code.gson:gson:2.11.0'

    // ── ONNX Runtime Mobile (Slice A — retrieval / embedding inference) ───────────────────────
    // onnxruntime-android: Java API + native arm64 .so for on-device ORT inference.
    // 1.19.2 is the latest stable on Maven Central as of 2025-Q1.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // onnxruntime-extensions-android: adds pre/post-processing ops, including SentencePiece
    // tokenizer op (OrtxTokenizer) used by the MiniLM/BGE embedder ONNX graph.
    // 0.13.0 is the latest stable on Maven Central (repo1.maven.org confirmed).
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0'

    // NOTE: No externalNativeBuild / CMake / Chaquopy / MediaPipe this phase.
    // CMake is not installed. Native build (llama.cpp JNI) comes in a later phase.
}
